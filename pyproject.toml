[project]
name = "ocr-service"
version = "0.1.0"
description = "Transcripción de comprobantes con PaddleOCR (receipt-parser)"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "pydantic-settings",
    "paddleocr==3.7.0",
    "paddlepaddle==3.2.0",
    "pypdfium2",
    "pillow",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "schemathesis", "testcontainers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_service"]

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src/ocr_service"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["paddleocr.*", "paddlex.*", "paddle.*", "pypdfium2.*"]  # pypdfium2 no publica py.typed
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["slow: necesita Docker y la imagen ocr-service:local"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore:`LoggingHandler` in `opentelemetry-sdk` is deprecated:DeprecationWarning"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ocr_service"]
branch = true
